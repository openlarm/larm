name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Release (changesets)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only run when the push is on a repo that has enabled releases.
    # Forks without secrets will skip automatically.
    if: github.repository_owner == 'openlarm'

    defaults:
      run:
        working-directory: low-altitude-ops-platform/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: low-altitude-ops-platform/frontend/package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Creates a PR with version bumps, or — if such a PR already
      # exists and has been merged — publishes to npm.
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          cwd: low-altitude-ops-platform/frontend
          # Provenance is produced by `npm publish --provenance` via
          # the publish script in package.json.
          publish: npm run release
          title: "chore: release"
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
