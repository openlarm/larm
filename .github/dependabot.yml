version: 2

updates:
  # GitHub Actions — keep workflow dependencies current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope

  # Frontend / @openlarm/core monorepo workspace.
  - package-ecosystem: npm
    directory: /low-altitude-ops-platform/frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
      include: scope
    groups:
      # Minor/patch bumps grouped into a single PR per week.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Types packages bumped together.
      types:
        patterns:
          - "@types/*"
    ignore:
      # Next.js majors are handled manually via next-upgrade skill.
      - dependency-name: "next"
        update-types:
          - version-update:semver-major
      # React majors handled manually to coordinate with Next.js.
      - dependency-name: "react"
        update-types:
          - version-update:semver-major
      - dependency-name: "react-dom"
        update-types:
          - version-update:semver-major
